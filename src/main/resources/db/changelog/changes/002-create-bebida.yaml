databaseChangeLog:
  - changeSet:
      id: 002-01-create-bebida
      author: curso-spring-2026
      changes:
        - createTable:
            tableName: bebida
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_bebida
                    nullable: false
              - column:
                  name: codigo_barras
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: descricao
                  type: VARCHAR(150)
                  constraints:
                    nullable: false
              - column:
                  name: saldo_estoque
                  type: NUMERIC(18, 3)
                  constraints:
                    nullable: false
              - column:
                  name: valor_unitario
                  type: NUMERIC(18, 2)
                  constraints:
                    nullable: false
              - column:
                  name: data_cadastro
                  type: DATE
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: categoria_bebida_id
                  type: BIGINT
                  constraints:
                    nullable: false
      rollback:
        - dropTable:
            tableName: bebida

  - changeSet:
      id: 002-02-unique-codigo-barras
      author: curso-spring-2026
      changes:
        - addUniqueConstraint:
            tableName: bebida
            columnNames: codigo_barras
            constraintName: uk_bebida_codigo_barras
      rollback:
        - dropUniqueConstraint:
            tableName: bebida
            constraintName: uk_bebida_codigo_barras

  - changeSet:
      id: 002-03-foreign-key-categoria-bebida
      author: curso-spring-2026
      changes:
        - addForeignKeyConstraint:
            baseTableName: bebida
            baseColumnNames: categoria_bebida_id
            referencedTableName: categoria_bebida
            referencedColumnNames: id
            constraintName: fk_bebida_categoria_bebida
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: bebida
            constraintName: fk_bebida_categoria_bebida

  - changeSet:
      id: 002-04-check-saldo-estoque
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE bebida
              ADD CONSTRAINT ck_bebida_saldo_estoque
              CHECK (saldo_estoque >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE bebida DROP CONSTRAINT ck_bebida_saldo_estoque

  - changeSet:
      id: 002-05-check-valor-unitario
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE bebida
              ADD CONSTRAINT ck_bebida_valor_unitario
              CHECK (valor_unitario >= 0)
      rollback:
        - sql:
            sql: ALTER TABLE bebida DROP CONSTRAINT ck_bebida_valor_unitario

  - changeSet:
      id: 002-06-check-status-bebida
      author: curso-spring-2026
      changes:
        - sql:
            sql: >
              ALTER TABLE bebida
              ADD CONSTRAINT ck_bebida_status
              CHECK (status IN ('ATIVO', 'INATIVO'))
      rollback:
        - sql:
            sql: ALTER TABLE bebida DROP CONSTRAINT ck_bebida_status
